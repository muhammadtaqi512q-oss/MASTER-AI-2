    <title>MT OK</title>
    <style>
        /* Tamam default margins aur paddings khatam karne ke liye */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;

            overflow: hidden; /* Taki double scrollbar na aaye */
            background-color: #000000; /* Agar website load hone mein time le tou blank white screen na dikhe */

            border: none;
            display: block;
        }

</head>
