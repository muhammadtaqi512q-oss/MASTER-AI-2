<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web builder api</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            /* Prevents text selection */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe id="myFrame" src="about:blank" allowfullscreen></iframe>

    <script>
        function loadTargetFrame() {
            const iframe = document.getElementById('myFrame');
            iframe.src = "page1.html";
        }

        window.onload = function() {
            loadTargetFrame();
            protectPage(window); // Protect parent page
        };

        // Core protection function
        function protectPage(win) {
            // 1. Disable Right Click
            win.document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
            });

            // 2. Disable Keyboard Shortcuts
            win.document.addEventListener('keydown', function(e) {
                // Disable F12
                if (e.key === 'F12' || e.keyCode === 123) {
                    e.preventDefault();
                    return false;
                }

                // Disable Ctrl+U (View Source), Ctrl+S (Save), Ctrl+Shift+I / Ctrl+Shift+J (DevTools)
                if (e.ctrlKey && (
                    e.key === 'u' || e.key === 'U' || 
                    e.key === 's' || e.key === 'S' || 
                    e.shiftKey && (e.key === 'i' || e.key === 'I' || e.key === 'j' || e.key === 'J' || e.key === 'c' || e.key === 'C')
                )) {
                    e.preventDefault();
                    return false;
                }
                
                // Disable Cmd+Opt+I / Cmd+Opt+U for Mac users
                if (e.metaKey && e.altKey && (e.key === 'i' || e.key === 'I' || e.key === 'u' || e.key === 'U')) {
                    e.preventDefault();
                    return false;
                }
            });
        }
    </script>

</body>
</html>
