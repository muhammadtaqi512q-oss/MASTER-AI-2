<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9.html - Frame Controller</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe id="myFrame" src="about:blank" allowfullscreen></iframe>

    <script>
        // Yeh function 10.html ko iframe ke andar load karega
        function loadTargetFrame() {
            const iframe = document.getElementById('myFrame');
            iframe.src = "page4.html";
        }

        // Agar aap chahte hain ke page open hote hi khud-ba-khud load ho jaye:
        window.onload = function() {
            loadTargetFrame();
        };
    </script>

</body>
</html>
